{% extends 'lyrics/base.html' %}

{% block content %}
  <div class="flex-kolumny">
    <div class="lewa">
        {% block left_column %}{% endblock left_column %}
    </div>
    <div class="prawa">
        {% block right_column %}{% endblock right_column %}
    </div>
  </div>

<style>
  .flex-kolumny {
    display: flex;
    gap: 20px;
  }

  .lewa {
    flex: 1;
  }

  .prawa {
    flex: 2;
  }

  @media (max-width: 768px) {
    .flex-kolumny {
      flex-direction: column;
    }
  }
</style>

{% endblock content %}
