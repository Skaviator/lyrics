{% extends 'lyrics/base.html' %}

{% block content %}
  
  <div class="flex-kolumny">
    <div class="lewa">
      <p>{{ translation.lyrics.artist }}</p>
      <p><strong>{{ translation.lyrics.title }} </strong></p> 
      {{ translation.lyrics.text|linebreaks }}

    </div>
    <div class="prawa">
      <p>tłum. {{ translation.author }}</p>
      <p><strong>{{translation.title}}</strong></p>
      {{ translation.text|linebreaks }}
       <p><a href="{% url 'lyrics:edit_translation' translation.id %}">Edit</a></p>
    </div>
  </div>
 
<style>
.flex-kolumny {
  display: flex;
  gap: 20px;
}

.lewa {
  flex: 1;
}

.prawa {
  flex: 2;
}

@media (max-width: 768px) {
  .flex-kolumny {
    flex-direction: column;
  }
}
</style>
{% endblock content %}
